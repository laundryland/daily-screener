name: IHSG Stock Screener Auto Update

on:
  schedule:
    # Berjalan otomatis tiap jam bursa 09:00 - 16:00 WIB (02:00 - 09:00 UTC), Senin-Jumat
    - cron: '0 2-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6  # Diperbarui ke versi patch terbaru

    - name: Set up Python
      uses: actions/setup-python@v6  # Diperbarui ke versi patch terbaru
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance

    - name: Run Screener Script
      run: python screener.py

    - name: Commit and Push Updated Data
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data.json
        if git diff --staged --quiet; then
          echo "Tidak ada perubahan data."
        else
          git commit -m "Auto update data.json [skip ci]"
          git push
        fi
