<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IHSG Screener Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-3 sm:p-6 font-sans">

  <!-- Header -->
  <header class="max-w-6xl mx-auto mb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
    <div>
      <h1 class="text-2xl font-bold text-emerald-400">⚡ IHSG Screener Pro</h1>
      <p class="text-xs text-slate-400">4 Emiten Tetap + 2 Emiten Harian (Trading Plan)</p>
    </div>
    <div class="flex flex-wrap gap-2 w-full md:w-auto">
      <button id="scanBtn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-semibold text-sm transition">
        Jalankan Scan
      </button>
      <button onclick="exportData()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium transition">
        💾 Backup
      </button>
      <label class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-medium cursor-pointer transition">
        📂 Restore
        <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
      </label>
    </div>
  </header>

  <!-- Panel Manajemen Emiten Harian -->
  <section class="max-w-6xl mx-auto mb-6 bg-slate-800 p-4 rounded-xl border border-slate-700">
    <div class="flex flex-col sm:flex-row gap-2 items-center">
      <input type="text" id="newTickerInput" placeholder="Tambah Emiten Harian (contoh: BBRI)" 
             class="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 w-full sm:w-64 focus:outline-none focus:border-emerald-500 uppercase">
      <button onclick="addDailyTicker()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-4 py-2 rounded-lg w-full sm:w-auto transition">
        + Tambah Emiten
      </button>
    </div>
    <!-- List Emiten Harian -->
    <div class="mt-3 flex flex-wrap gap-2 items-center">
      <span class="text-xs text-slate-400 font-semibold">Emiten Harian (Max 2 Aktif):</span>
      <div id="dailyTickersList" class="flex flex-wrap gap-2"></div>
    </div>
  </section>

  <!-- Tampilan Utama Grid Screener -->
  <main class="max-w-6xl mx-auto">
    <div id="screenerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-8 text-slate-400">Klik "Jalankan Scan" untuk memulai.</div>
    </div>
  </main>

  <script>
    // Config Emiten
    const FIXED_TICKERS = ['CUAN', 'BULL', 'TINS', 'FILM']; // 4 Emiten Tetap
    let dailyTickers = JSON.parse(localStorage.getItem('IHSG_DAILY_TICKERS')) || ['SQMI', 'COCO']; // Default 2 Emiten Harian

    // Simpan & Render List Ticker Harian
    function saveDailyTickers() {
      localStorage.setItem('IHSG_DAILY_TICKERS', JSON.stringify(dailyTickers));
      renderDailyBadges();
    }

    function renderDailyBadges() {
      const container = document.getElementById('dailyTickersList');
      container.innerHTML = dailyTickers.map((t, idx) => `
        <span class="bg-slate-700 text-slate-200 text-xs px-2,5 py-1 rounded-md flex items-center gap-1 font-bold">
          ${t}
          <button onclick="removeDailyTicker(${idx})" class="text-rose-400 hover:text-rose-300 ml-1">✕</button>
        </span>
      `).join('');
    }

    function addDailyTicker() {
      const input = document.getElementById('newTickerInput');
      const val = input.value.trim().toUpperCase();
      if (!val) return;
      if (FIXED_TICKERS.includes(val) || dailyTickers.includes(val)) {
        alert('Emiten sudah ada!');
        return;
      }
      dailyTickers.push(val);
      saveDailyTickers();
      input.value = '';
    }

    function removeDailyTicker(index) {
      dailyTickers.splice(index, 1);
      saveDailyTickers();
    }

    // Backup & Restore
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dailyTickers));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `ihsg_screener_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            dailyTickers = imported;
            saveDailyTickers();
            alert('Restore berhasil!');
          }
        } catch (err) {
          alert('Format file backup tidak valid!');
        }
      };
      fileReader.readAsText(event.target.files[0]);
    }

    // Kalkulasi Indikator
    function calculateEMA(data, period) {
      const k = 2 / (period + 1);
      let ema = data[0];
      for (let i = 1; i < data.length; i++) {
        ema = (data[i] * k) + (ema * (1 - k));
      }
      return ema;
    }

    async function fetchStockData(symbol) {
      const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}.JK?range=1mo&interval=1d`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
      const res = await fetch(proxyUrl);
      const json = await res.json();
      const parsedData = JSON.parse(json.contents);
      const result = parsedData.chart.result[0];
      const quotes = result.indicators.quote[0];
      
      return {
        close: quotes.close.filter(v => v !== null),
        volume: quotes.volume.filter(v => v !== null)
      };
    }

    // Render Dot Status (Merah = Sell, Hijau = Buy, Putih = Netral)
    function getDot(status) {
      if (status === 'BUY') return '<span class="inline-block w-3 h-3 rounded-full bg-emerald-500 border border-emerald-300 shadow-sm" title="Buy"></span>';
      if (status === 'SELL') return '<span class="inline-block w-3 h-3 rounded-full bg-rose-500 border border-rose-300 shadow-sm" title="Sell"></span>';
      return '<span class="inline-block w-3 h-3 rounded-full bg-slate-100 border border-slate-300 shadow-sm" title="Netral"></span>';
    }

    // Engine Utama Screener
    async function runScreener() {
      const grid = document.getElementById('screenerGrid');
      grid.innerHTML = '<div class="col-span-full text-center py-8 text-amber-400">Sedang mengambil data & memproses statistik...</div>';

      // Gabungkan 4 Tetap + Maksimal 2 Harian Teratas untuk Scan Utama
      const activeDaily = dailyTickers.slice(0, 2);
      const targetTickers = [
        ...FIXED_TICKERS.map(t => ({ symbol: t, type: 'Tetap' })),
        ...activeDaily.map(t => ({ symbol: t, type: 'Harian' }))
      ];

      let cardsHtml = '';

      for (const item of targetTickers) {
        try {
          const data = await fetchStockData(item.symbol);
          const close = data.close;
          const volume = data.volume;
          
          const lastClose = close[close.length - 1];
          const prevClose = close[close.length - 2];
          const lastVol = volume[volume.length - 1];
          
          // Indikator 1: Volume Spike
          const avgVol20 = volume.slice(-20).reduce((a, b) => a + b, 0) / 20;
          const volRatio = (lastVol / avgVol20).toFixed(2);
          const volStatus = volRatio >= 1.5 ? 'BUY' : (volRatio < 0.8 ? 'SELL' : 'NEUTRAL');

          // Indikator 2: EMA 5 vs EMA 13
          const ema5 = calculateEMA(close.slice(-5), 5);
          const ema13 = calculateEMA(close.slice(-13), 13);
          const emaStatus = (ema5 > ema13 && lastClose > ema5) ? 'BUY' : ((ema5 < ema13 && lastClose < ema5) ? 'SELL' : 'NEUTRAL');

          // Indikator 3: Perubahan Harga Harian (Momentum)
          const priceChangePercent = ((lastClose - prevClose) / prevClose) * 100;
          const priceStatus = priceChangePercent > 1.5 ? 'BUY' : (priceChangePercent < -1.5 ? 'SELL' : 'NEUTRAL');

          // Ringkasan Sinyal
          let overallSignal = '<span class="text-slate-400 font-medium">HOLD / NETRAL</span>';
          if (volStatus === 'BUY' && emaStatus === 'BUY') {
            overallSignal = '<span class="text-emerald-400 font-bold">STRONG BUY</span>';
          } else if (volStatus === 'BUY' || emaStatus === 'BUY') {
            overallSignal = '<span class="text-amber-400 font-bold">ACCUMULATION</span>';
          } else if (volStatus === 'SELL' && emaStatus === 'SELL') {
            overallSignal = '<span class="text-rose-400 font-bold">STRONG SELL</span>';
          }

          cardsHtml += `
            <div class="bg-slate-800 rounded-xl p-4 border ${item.type === 'Tetap' ? 'border-slate-700' : 'border-blue-500/50'} flex flex-col justify-between">
              <div>
                <!-- Header Card -->
                <div class="flex justify-between items-center mb-3">
                  <div>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded ${item.type === 'Tetap' ? 'bg-slate-700 text-slate-300' : 'bg-blue-900/60 text-blue-300'}">${item.type}</span>
                    <h2 class="text-xl font-bold text-white mt-1">${item.symbol}</h2>
                  </div>
                  <div class="text-right">
                    <div class="text-lg font-bold">Rp ${lastClose.toLocaleString('id-ID')}</div>
                    <div class="text-xs ${priceChangePercent >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${priceChangePercent >= 0 ? '+' : ''}${priceChangePercent.toFixed(2)}%</div>
                  </div>
                </div>

                <hr class="border-slate-700 my-3">

                <!-- Detail Tiap Indikator Dengan Bulatan Warna -->
                <div class="space-y-2.5 text-sm">
                  <div class="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg">
                    <span class="text-slate-400">Volume Ratio (20D):</span>
                    <div class="flex items-center gap-2">
                      <span class="font-semibold">${volRatio}x</span>
                      ${getDot(volStatus)}
                    </div>
                  </div>

                  <div class="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg">
                    <span class="text-slate-400">Tren EMA (5/13):</span>
                    <div class="flex items-center gap-2">
                      <span class="font-semibold">${ema5 > ema13 ? 'Bullish' : 'Bearish'}</span>
                      ${getDot(emaStatus)}
                    </div>
                  </div>

                  <div class="flex justify-between items-center bg-slate-900/50 p-2 rounded-lg">
                    <span class="text-slate-400">Price Action:</span>
                    <div class="flex items-center gap-2">
                      <span class="font-semibold">${priceChangePercent >= 0 ? 'Upward' : 'Downward'}</span>
                      ${getDot(priceStatus)}
                    </div>
                  </div>
                </div>
              </div>

              <!-- Footer Card / Sinyal Akhir -->
              <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between items-center">
                <span class="text-xs text-slate-400">Sinyal Sistem:</span>
                <div>${overallSignal}</div>
              </div>
            </div>
          `;
        } catch (err) {
          cardsHtml += `
            <div class="bg-slate-800 rounded-xl p-4 border border-rose-900/50">
              <h2 class="text-lg font-bold text-white">${item.symbol}</h2>
              <p class="text-xs text-rose-400 mt-2">Gagal memuat data dari API.</p>
            </div>
          `;
        }
      }

      grid.innerHTML = cardsHtml;
    }

    // Init
    renderDailyBadges();
    document.getElementById('scanBtn').addEventListener('click', runScreener);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
