<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IHSG Daily Screener</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512x512.png">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; padding-bottom: 40px; }
    
    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 1.3rem; color: #38bdf8; letter-spacing: 0.5px; }
    .update-time { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }

    .control-box { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 16px; }
    .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
    select { flex: 1; min-width: 140px; padding: 8px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.85rem; }

    .group-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .tab { padding: 6px 14px; background: #1e293b; border-radius: 20px; font-size: 0.8rem; white-space: nowrap; border: 1px solid #334155; color: #94a3b8; cursor: pointer; }
    .tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: bold; }

    .card-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .card { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; position: relative; }
    
    .card-ihsg { background: #1e1b4b; border: 1px solid #6366f1; }
    .card-ihsg .ticker { color: #a5b4fc; }
    .card-ihsg .group-tag { background: #312e81; color: #c7d2fe; }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .ticker { font-weight: bold; font-size: 1.1rem; color: #fff; }
    .price { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; color: #f1f5f9; }
    
    .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; }
    .strong-r { background: #047857; color: #34d399; border: 1px solid #10b981; }
    .breakout-r { background: #15803d; color: #86efac; border: 1px solid #22c55e; }
    .strong-s { background: #881337; color: #fda4af; border: 1px solid #f43f5e; }
    .breakout-s { background: #b91c1c; color: #fca5a5; border: 1px solid #ef4444; }
    .buy { background: #166534; color: #4ade80; }
    .sell { background: #991b1b; color: #fca5a5; }
    .neutral { background: #334155; color: #94a3b8; }

    .dot-indicator { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 2px; margin-right: 6px; vertical-align: middle; }
    .dot-buy { background-color: #22c55e; box-shadow: 0 0 5px #22c55e; }
    .dot-neutral { background-color: #f8fafc; box-shadow: 0 0 3px #f8fafc; }
    .dot-sell { background-color: #ef4444; box-shadow: 0 0 5px #ef4444; }

    .group-tag { font-size: 0.68rem; color: #38bdf8; background: #0c4a6e; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
    .stat { font-size: 0.78rem; color: #94a3b8; margin-top: 3px; }
    .vol-high { color: #facc15; font-weight: bold; }

    .trade-zone { background: #0f172a; padding: 6px 8px; border-radius: 6px; margin-top: 8px; border: 1px solid #334155; font-size: 0.75rem; }
    .zone-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .txt-entry { color: #38bdf8; font-weight: bold; }
    .txt-sl { color: #f87171; font-weight: bold; }
    .txt-tp { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ IHSG SCREENER TRADING HARIAN</h1>
    <p class="update-time" id="updateTime">Memuat data...</p>
  </header>

  <div class="control-box">
    <div class="form-row">
      <select id="stockPicker" onchange="addSelectedStock()">
        <option value="">+ Pilih & Tampilkan Emiten...</option>
      </select>
    </div>
  </div>

  <div class="group-tabs" id="groupTabs">
    <div class="tab active" onclick="filterGroup('ALL', this)">Semua Ditampilkan</div>
  </div>

  <div class="card-grid" id="stockGrid"></div>

  <script>
    let rawData = [];
    let displayedTickers = JSON.parse(localStorage.getItem('my_watch_list')) || ["IHSG"];
    
    // IHSG Selalu di Depan
    if (!displayedTickers.includes("IHSG")) displayedTickers.unshift("IHSG");

    function formatWIB(timeStr) {
      if (!timeStr) return "-";
      try {
        const date = new Date(timeStr);
        if (isNaN(date.getTime())) return timeStr;
        return date.toLocaleString('id-ID', {
          timeZone: 'Asia/Jakarta',
          day: '2-digit', month: 'long', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        }) + " WIB";
      } catch (e) { return timeStr; }
    }

    async function loadData() {
      try {
        // Cuma baca 1 file json ringan, super cepat!
        const res = await fetch('./data.json?v=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        
        document.getElementById('updateTime').innerText = "Diperbarui: " + formatWIB(data.updated_at);
        rawData = data.stocks || [];

        populateDropdown();
        render();
      } catch (e) {
        document.getElementById('updateTime').innerText = "Gagal memuat data.json";
      }
    }

    function populateDropdown() {
      const picker = document.getElementById('stockPicker');
      picker.innerHTML = '<option value="">+ Pilih & Tampilkan Emiten...</option>';
      
      rawData.forEach(stock => {
        if (stock.ticker !== 'IHSG' && !displayedTickers.includes(stock.ticker)) {
          const opt = document.createElement('option');
          opt.value = stock.ticker;
          opt.innerText = stock.ticker;
          picker.appendChild(opt);
        }
      });
    }

    function render() {
      const grid = document.getElementById('stockGrid');
      grid.innerHTML = '';

      displayedTickers.forEach(ticker => {
        const stock = rawData.find(s => s.ticker === ticker);
        if (!stock) return;

        let badgeClass = 'neutral';
        if (stock.signal === 'SBR') badgeClass = 'strong-r';
        else if (stock.signal === 'Break R') badgeClass = 'breakout-r';
        else if (stock.signal === 'SBS') badgeClass = 'strong-s';
        else if (stock.signal === 'Break S') badgeClass = 'breakout-s';
        else if (stock.signal === 'BUY') badgeClass = 'buy';
        else if (stock.signal === 'SELL') badgeClass = 'sell';

        let rsiDotClass = stock.rsi_status === 'BUY' ? 'dot-buy' : (stock.rsi_status === 'SELL' ? 'dot-sell' : 'dot-neutral');
        let emaDotClass = stock.ema_status === 'BUY' ? 'dot-buy' : (stock.ema_status === 'SELL' ? 'dot-sell' : 'dot-neutral');

        const isVolHigh = stock.vol_ratio >= 1.5;
        const volClass = isVolHigh ? 'vol-high' : '';
        const volIcon = isVolHigh ? '⚡ ' : '';

        const isIhsg = stock.ticker === 'IHSG';

        const card = document.createElement('div');
        card.className = isIhsg ? 'card card-ihsg' : 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="ticker">${stock.ticker}</span>
            <span class="badge ${badgeClass}">${stock.signal}</span>
          </div>
          <span class="group-tag">${isIhsg ? 'Indeks Utama' : 'Pilihan'}</span>
          <div class="price">Rp ${Number(stock.price).toLocaleString('id-ID')}</div>
          
          <div class="stat">
            RSI: <span class="dot-indicator ${rsiDotClass}"></span> (${stock.rsi}) | 
            EMA: <span class="dot-indicator ${emaDotClass}"></span> (${stock.ema20})
          </div>
          <div class="stat">SND: S ${stock.support} | R ${stock.resistance}</div>
          <div class="stat ${volClass}">VR: ${volIcon}${stock.vol_ratio}x Rerata</div>

          <div class="trade-zone">
            <div class="zone-row"><span>Entry Masuk:</span> <span class="txt-entry">${stock.entry}</span></div>
            <div class="zone-row"><span>Stop Loss:</span> <span class="txt-sl">${stock.stop_loss}</span></div>
            <div class="zone-row"><span>Cut Profit (TP):</span> <span class="txt-tp">${stock.take_profit}</span></div>
          </div>

          ${!isIhsg ? `<div style="text-align:right; margin-top:8px;"><button onclick="removeStock('${stock.ticker}')" style="background:#dc2626; border:none; color:#fff; font-size:0.7rem; padding:3px 8px; border-radius:4px; cursor:pointer;">Sembunyikan</button></div>` : ''}
        `;
        grid.appendChild(card);
      });
    }

    function addSelectedStock() {
      const picker = document.getElementById('stockPicker');
      const val = picker.value;
      if (val && !displayedTickers.includes(val)) {
        displayedTickers.push(val);
        localStorage.setItem('my_watch_list', JSON.stringify(displayedTickers));
        render();
        populateDropdown();
      }
    }

    function removeStock(ticker) {
      if (ticker === 'IHSG') return;
      displayedTickers = displayedTickers.filter(t => t !== ticker);
      localStorage.setItem('my_watch_list', JSON.stringify(displayedTickers));
      render();
      populateDropdown();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    loadData();
  </script>
</body>
</html>
